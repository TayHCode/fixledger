[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fixledger"
version = "0.1.0"
description = "A persistent ledger that helps coding agents avoid repeating findings."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
fixledger = "fixledger.cli:main"

[tool.setuptools.packages.find]
include = ["fixledger*"]
